packages:
  - apps/*
  - packages/*

# Exact versions only; a new release must be older than a day (minutes) before it installs.
saveExact: true
minimumReleaseAge: 1440

# Packages whose install scripts may run; unlisted ones fail the install.
# The scaffold run confirms this list: add what pnpm reports, remove what it never asks for.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
