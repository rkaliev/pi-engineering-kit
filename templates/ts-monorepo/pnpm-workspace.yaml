packages:
  - apps/*
  - packages/*

# Exact versions only; a new release must be older than a day (minutes) before it installs.
saveExact: true
minimumReleaseAge: 1440

# Packages whose install scripts may run; unlisted ones fail the install.
# Confirmed by the scaffold run: pnpm asks for exactly these two. If a later install reports another, add it here.
allowBuilds:
  prisma: true
  "@prisma/engines": true
