name: Bug report
description: Something in the kit behaves differently than its docs say
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Kit version
      placeholder: "0.40.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: pi version and OS
      description: "Output of `pi --version`, and your operating system"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest project and prompt or command that shows it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove tokens, keys and other secrets before pasting.
      render: text
