name: Template smoke

# Scaffolds templates/ts-monorepo for real and runs its checks. Red means the ecosystem moved
# and the template needs a fix. It is not part of the CI `gate` and does not block a release.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "templates/ts-monorepo/**"
      - "scripts/scaffold-template.ts"
      - "extensions/lib/scaffold.ts"
      - ".github/workflows/template-smoke.yml"

concurrency:
  group: template-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18   # current supported major (postgresql.org/support/versioning); bump with the template
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      # Node 25+ no longer bundles corepack: install pnpm with the action. `version` is required
      # because the scaffold folder has no packageManager yet.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: latest
      - name: Scaffold
        run: node scripts/scaffold-template.ts "$RUNNER_TEMP/app"
      - name: Typecheck, lint, test
        working-directory: ${{ runner.temp }}/app
        run: pnpm turbo run typecheck lint test build
      - name: Migrate
        working-directory: ${{ runner.temp }}/app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
        run: pnpm --filter @repo/db exec prisma migrate deploy
